services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    command: python -m app.main
    environment:
      DATABASE_URL: postgresql://finance:finance@db:5432/finance
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/srv
    depends_on:
      db:
        condition: service_healthy

  sync:
    build: .
    command: python -m app.sync
    environment:
      DATABASE_URL: postgresql://finance:finance@db:5432/finance
      SYNC_INTERVAL_SECONDS: "600"
    volumes:
      - .:/srv
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:

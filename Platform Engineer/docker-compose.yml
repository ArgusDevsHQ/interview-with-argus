services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: roasters
      POSTGRES_PASSWORD: roasters
      POSTGRES_DB: roasters
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roasters -d roasters"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    command: python -m app.main
    environment:
      DATABASE_URL: postgresql://roasters:roasters@db:5432/roasters
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/srv
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql://roasters:roasters@db:5432/roasters
      STOCK_UPDATE_INTERVAL_SECONDS: "300"
    volumes:
      - .:/srv
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:

[project]
name = "argus-net-new"
version = "0.1.0"
description = "Starter workflow for the Argus ML evaluation and data engineering exercise"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "openai>=1.68,<3",
  "pandas>=2.2,<3",
  "plotly>=6,<7",
  "pydantic>=2.10,<3",
  "streamlit>=1.45,<2",
  "exchange-calendars>=4.8,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
authoring = ["exchange-calendars>=4.8,<5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
